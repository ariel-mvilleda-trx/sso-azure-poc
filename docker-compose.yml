version: "3.9"

services:
  # Backend API A - FastAPI con Python
  api-a:
    build:
      context: .
      dockerfile: Dockerfile.api_a
    container_name: auth-test-api-a
    ports:
      - "8000:8000"
    environment:
      # Variables de entorno desde .env (requeridas)
      TENANT_ID: ${TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      API_B_CLIENT_ID: ${API_B_CLIENT_ID}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: ${PORT_A}
    volumes:
      # Mount para desarrollo (permitir cambios sin rebuild)
      - ./api_a.py:/app/api_a.py
      - ./requirements.txt:/app/requirements.txt
      - ./.env:/app/.env
    networks:
      - auth-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend API B - FastAPI con Python (segunda API)
  api-b:
    build:
      context: .
      dockerfile: Dockerfile.api_b
    container_name: auth-test-api-b
    ports:
      - "8002:8002"
    environment:
      # Variables de entorno desde .env (requeridas)
      TENANT_ID: ${TENANT_ID}
      API_B_CLIENT_ID: ${API_B_CLIENT_ID}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT_B: ${PORT_B:-8002}
    volumes:
      # Mount para desarrollo (permitir cambios sin rebuild)
      - ./api_b.py:/app/api_b.py
      - ./requirements.txt:/app/requirements.txt
      - ./.env:/app/.env
    networks:
      - auth-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend - Nginx sirviendo el HTML estático
  frontend:
    image: nginx:alpine
    container_name: auth-test-frontend
    ports:
      - "5500:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - auth-network
    depends_on:
      - api-a
      - api-b
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  auth-network:
    driver: bridge
