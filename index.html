<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO POC - SPA Front | Azure Entra ID</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f4f4f4; padding: 15px; overflow-x: auto; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>POC: Azure Entra ID SSO - SPA Front</h1>
    
    <div id="not-authenticated">
        <p>No has iniciado sesión.</p>
        <button onclick="login()">Iniciar Sesión con Microsoft</button>
    </div>
    
    <div id="authenticated" class="hidden">
        <h2 class="success">✓ Autenticado</h2>
        <button onclick="logout()">Cerrar Sesión</button>
        <button onclick="callApiA()">Llamar API A /me</button>
        <button onclick="callApiB()">Llamar API B /me</button>
        <button onclick="debugTokenA()">Debug Token API A</button>
        <button onclick="debugTokenB()">Debug Token API B</button>
        
        <div id="user-info">
            <h3>Usuario:</h3>
            <pre id="user-claims"></pre>
        </div>
        
        <div id="api-a-response" class="hidden">
            <h3>Respuesta de API A:</h3>
            <pre id="api-a-result"></pre>
        </div>
        
        <div id="api-b-response" class="hidden">
            <h3>Respuesta de API B:</h3>
            <pre id="api-b-result"></pre>
        </div>
    </div>

    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    
    <script>
        // ============================================
        // CONFIGURACIÓN DESDE VARIABLES DE ENTORNO
        // (cargadas desde el backend)
        // ============================================
        let TENANT_ID, CLIENT_ID, API_A_CLIENT_ID, API_B_CLIENT_ID, API_A_BASE_URL, API_B_BASE_URL;
        let msalConfig, loginRequest, msalInstance, accessToken = null;

        // Cargar configuración del backend
        async function initializeApp() {
            try {
                // Leer variables de entorno del frontend (si están disponibles globalmente)
                API_A_BASE_URL = window.CONFIG?.API_A_BASE_URL || "http://localhost:8000";
                API_B_BASE_URL = window.CONFIG?.API_B_BASE_URL || "http://localhost:8002";
                CLIENT_ID = window.CONFIG?.CLIENT_ID || "806c2125-9965-4337-8362-210d46d31288"; // SPA registrada en Azure EntraID
                TENANT_ID = window.CONFIG?.TENANT_ID || "69dd60e9-25af-4faf-b218-c001e35da267"; // Azure EntraID project tenant ID
                API_A_CLIENT_ID = window.CONFIG?.API_A_CLIENT_ID || "fd0c747e-f68d-4592-99ef-9f7cb53426e5"; // app apiA Azure EntraID
                API_B_CLIENT_ID = window.CONFIG?.API_B_CLIENT_ID || "06ddbb66-03f4-4892-b4f1-4bbbde45d0ad"; // app apiB Azure EntraID

                // Configurar MSAL
                msalConfig = {
                    auth: {
                        clientId: CLIENT_ID,
                        authority: `https://traxionexternal.ciamlogin.com/${TENANT_ID}`,
                        redirectUri: window.location.origin + "/index.html",
                    },
                    cache: {
                        cacheLocation: "sessionStorage",
                    },
                };

                // Scopes: incluye el scope de la API
                loginRequest = {
                    scopes: ["openid", "profile"],
                };

                // ============================================
                // MSAL
                // ============================================
                msalInstance = new msal.PublicClientApplication(msalConfig);

                msalInstance.initialize().then(() => {
                    msalInstance.handleRedirectPromise().then(handleResponse).catch(console.error);
                });

                // // obtener token para apiapp A ,dependiendo la funcionalidad delflujo seguido en el front
                // const tokenA = await msalInstance.acquireTokenSilent({
                //     scopes: [`api://${API_A_CLIENT_ID}/access`]
                // });

                // // obtener token para apiapp B ,dependiendo la funcionalidad delflujo seguido en el front
                // const tokenB = await msalInstance.acquireTokenSilent({
                //     scopes: [`api://${API_B_CLIENT_ID}/access`]
                // });
            } catch (error) {
                console.error("Error inicializando aplicación:", error);
            }
        }

        // Inicializar cuando el DOM esté listo
        initializeApp();

        function handleResponse(response) {
            if (response) {
                accessToken = response.accessToken;
                showAuthenticatedUI(response.account);
            } else {
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    msalInstance.acquireTokenSilent({
                        ...loginRequest,
                        account: accounts[0]
                    }).then(response => {
                        accessToken = response.accessToken;
                        showAuthenticatedUI(accounts[0]);
                    }).catch(() => {});
                }
            }
        }

        function login() {
            msalInstance.loginRedirect(loginRequest);
        }

        function logout() {
            msalInstance.logoutRedirect();
        }

        function showAuthenticatedUI(account) {
            document.getElementById("not-authenticated").classList.add("hidden");
            document.getElementById("authenticated").classList.remove("hidden");
            document.getElementById("user-claims").textContent = JSON.stringify({
                name: account.name,
                username: account.username,
            }, null, 2);
        }

        async function callApiA() {
            if (!accessToken) {
                alert("No hay token disponible");
                return;
            }

            try {
                const tokenRequest = {
                    scopes: [`api://${API_A_CLIENT_ID}/access`],
                    account: msalInstance.getAllAccounts()[0]
                };

                let tokenResponse;
                try {
                    // Intentar obtener token silenciosamente
                    tokenResponse = await msalInstance.acquireTokenSilent(tokenRequest);
                } catch (silentError) {
                    // Si falla (ej: falta consentimiento), solicitar interactivamente
                    console.log("Token silencioso falló, solicitando consentimiento interactivo...", silentError);
                    tokenResponse = await msalInstance.acquireTokenPopup(tokenRequest);
                }
                
                const response = await fetch(`${API_A_BASE_URL}/me`, {
                    headers: { "Authorization": `Bearer ${tokenResponse.accessToken}` }
                });
                const data = await response.json();
                
                document.getElementById("api-a-response").classList.remove("hidden");
                document.getElementById("api-a-result").textContent = JSON.stringify(data, null, 2);
                document.getElementById("api-a-result").style.color = response.ok ? "green" : "red";
            } catch (error) {
                document.getElementById("api-a-response").classList.remove("hidden");
                document.getElementById("api-a-result").textContent = `Error: ${error.message}`;
                document.getElementById("api-a-result").style.color = "red";
            }
        }

        async function callApiB() {
            if (!accessToken) {
                alert("No hay token disponible");
                return;
            }

            try {
                const tokenRequest = {
                    scopes: [`api://${API_B_CLIENT_ID}/access`],
                    account: msalInstance.getAllAccounts()[0]
                };

                let tokenResponse;
                try {
                    // Intentar obtener token silenciosamente
                    tokenResponse = await msalInstance.acquireTokenSilent(tokenRequest);
                } catch (silentError) {
                    // Si falla (ej: falta consentimiento), solicitar interactivamente
                    console.log("Token silencioso falló, solicitando consentimiento interactivo...", silentError);
                    tokenResponse = await msalInstance.acquireTokenPopup(tokenRequest);
                }
                
                const response = await fetch(`${API_B_BASE_URL}/me`, {
                    headers: { "Authorization": `Bearer ${tokenResponse.accessToken}` }
                });
                const data = await response.json();
                
                document.getElementById("api-b-response").classList.remove("hidden");
                document.getElementById("api-b-result").textContent = JSON.stringify(data, null, 2);
                document.getElementById("api-b-result").style.color = response.ok ? "green" : "red";
            } catch (error) {
                document.getElementById("api-b-response").classList.remove("hidden");
                document.getElementById("api-b-result").textContent = `Error: ${error.message}`;
                document.getElementById("api-b-result").style.color = "red";
            }
        }

        async function debugTokenB() {
            if (!accessToken) {
                alert("No hay token disponible");
                return;
            }

            try {
                const response = await fetch(`${API_B_BASE_URL}/debug-token`, {
                    headers: { "Authorization": `Bearer ${accessToken}` }
                });
                const data = await response.json();
                
                document.getElementById("api-b-response").classList.remove("hidden");
                document.getElementById("api-b-result").textContent = JSON.stringify(data, null, 2);
                document.getElementById("api-b-result").style.color = "blue";
            } catch (error) {
                document.getElementById("api-b-response").classList.remove("hidden");
                document.getElementById("api-b-result").textContent = `Error: ${error.message}`;
                document.getElementById("api-b-result").style.color = "red";
            }
        }
    </script>
</body>
</html>
